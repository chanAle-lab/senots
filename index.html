<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENOTS · Geology Past Papers</title>
<meta name="description" content="Minimalist past paper revision question bank for WJEC Eduqas AS and A level Geology, organised by topic.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --font: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  
  /* Minimalist Light Palette */
  --bg: #fafafa;
  --surface: #ffffff;
  --surface-hover: #f4f4f5;
  --ink: #18181b;
  --ink-secondary: #52525b;
  --muted: #71717a;
  --border: #e4e4e7;
  --border-strong: #d4d4d8;
  --accent: #18181b;
  --accent-contrast: #ffffff;
  --mark-bg: #f4f4f5;
  --mark-color: #27272a;
  --tag-bg: #f4f4f5;
  --tag-ink: #3f3f46;
  --radius: 6px;
  --radius-lg: 8px;
}

[data-theme="dark"] {
  /* Minimalist Dark Palette */
  --bg: #09090b;
  --surface: #121215;
  --surface-hover: #18181b;
  --ink: #f4f4f5;
  --ink-secondary: #a1a1aa;
  --muted: #71717a;
  --border: #27272a;
  --border-strong: #3f3f46;
  --accent: #f4f4f5;
  --accent-contrast: #09090b;
  --mark-bg: #27272a;
  --mark-color: #f4f4f5;
  --tag-bg: #1c1c20;
  --tag-ink: #d4d4d8;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.15s ease, color 0.15s ease;
}

/* ========================================================
   Password Gate (Minimalist)
   ======================================================== */
.lock-screen {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.lock-card {
  width: 100%;
  max-width: 360px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 32px 28px;
  text-align: left;
}
.lock-title {
  font-size: 1.15rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin: 0 0 6px;
  color: var(--ink);
}
.lock-desc {
  font-size: 0.85rem;
  color: var(--muted);
  margin: 0 0 20px;
  line-height: 1.5;
}
.lock-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.lock-input-wrap {
  position: relative;
}
.lock-input {
  width: 100%;
  padding: 10px 36px 10px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-family: inherit;
  font-size: 0.9rem;
  color: var(--ink);
  outline: none;
  transition: border-color 0.15s;
}
.lock-input:focus {
  border-color: var(--ink);
}
.lock-eye-btn {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: transparent;
  border: 0;
  color: var(--muted);
  cursor: pointer;
  padding: 0;
  font-size: 0.8rem;
}
.lock-options {
  font-size: 0.8rem;
  color: var(--muted);
}
.lock-options label {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.lock-submit-btn {
  background: var(--accent);
  color: var(--accent-contrast);
  border: 0;
  padding: 10px 16px;
  border-radius: var(--radius);
  font-family: inherit;
  font-size: 0.88rem;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.15s;
}
.lock-submit-btn:hover {
  opacity: 0.9;
}
.lock-error {
  font-size: 0.8rem;
  color: #dc2626;
  min-height: 18px;
}

/* App container */
#app-root {
  display: none;
}
#app-root.unlocked {
  display: block;
}

/* ========================================================
   Site Header & Clean Navigation
   ======================================================== */
.site-header {
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky;
  top: 0;
  z-index: 30;
}
.header-inner {
  max-width: 960px;
  margin: 0 auto;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  text-decoration: none;
  color: var(--ink);
}
.brand-name {
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.brand-sub {
  font-size: 0.8rem;
  color: var(--muted);
}

.view-tabs {
  display: flex;
  gap: 4px;
}
.tab-link {
  background: transparent;
  border: 0;
  padding: 6px 12px;
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--muted);
  border-radius: var(--radius);
  cursor: pointer;
  transition: color 0.15s, background-color 0.15s;
}
.tab-link:hover {
  color: var(--ink);
  background: var(--surface-hover);
}
.tab-link.active {
  color: var(--ink);
  background: var(--surface-hover);
  font-weight: 600;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}
.stats-badge {
  font-size: 0.8rem;
  color: var(--muted);
  cursor: pointer;
}
.stats-badge b {
  color: var(--ink);
}
.stats-badge:hover {
  color: var(--ink);
}
.btn-minimal {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--ink-secondary);
  border-radius: var(--radius);
  padding: 4px 10px;
  font-family: inherit;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-minimal:hover {
  background: var(--surface-hover);
  color: var(--ink);
  border-color: var(--border-strong);
}

/* ========================================================
   Main Content Layout
   ======================================================== */
.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 24px 20px 80px;
}

/* Minimalist Search & Filter Bar */
.filter-panel {
  margin-bottom: 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.search-input-wrap {
  position: relative;
}
.search-input {
  width: 100%;
  padding: 10px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-family: inherit;
  font-size: 0.9rem;
  color: var(--ink);
  outline: none;
  transition: border-color 0.15s;
}
.search-input:focus {
  border-color: var(--border-strong);
}
.filter-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.select-minimal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--ink);
  padding: 6px 10px;
  font-family: inherit;
  font-size: 0.82rem;
  outline: none;
  cursor: pointer;
  transition: border-color 0.15s;
}
.select-minimal:focus {
  border-color: var(--border-strong);
}

/* Minimalist Filter Chips */
.chips-bar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 4px;
}
.chip-btn {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 3px 10px;
  font-size: 0.78rem;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.chip-btn:hover {
  color: var(--ink);
  border-color: var(--border-strong);
}
.chip-btn.active {
  background: var(--ink);
  color: var(--surface);
  border-color: var(--ink);
}
.btn-reset-inline {
  margin-left: auto;
  background: transparent;
  border: 0;
  font-size: 0.78rem;
  color: var(--muted);
  cursor: pointer;
  padding: 2px 4px;
  text-decoration: underline;
}
.btn-reset-inline:hover {
  color: var(--ink);
}

/* Status / Count bar */
.status-bar {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 18px;
  font-size: 0.82rem;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  padding-bottom: 10px;
}
.status-bar b {
  color: var(--ink);
}

/* ========================================================
   Stratigraphic Column (Clean Cross-Section Style)
   ======================================================== */
.strata-wrap {
  display: flex;
  flex-direction: column;
  gap: 28px;
}
.strata-section-title {
  font-size: 0.95rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
  margin: 0 0 10px;
}
.strata-column {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface);
}
.strata-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  text-decoration: none;
  color: inherit;
  background: var(--surface);
  transition: background-color 0.15s;
  position: relative;
}
.strata-row:last-child {
  border-bottom: 0;
}
.strata-row:hover {
  background: var(--surface-hover);
}
.strata-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.strata-color-indicator {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  background: var(--c);
  flex-shrink: 0;
}
.strata-name {
  font-size: 0.9rem;
  font-weight: 500;
}
.strata-right {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 0.8rem;
  color: var(--muted);
}
.strata-mark-pill {
  font-size: 0.78rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: var(--radius);
  background: var(--mark-bg);
  color: var(--mark-color);
}

/* ========================================================
   Question Cards (Minimalist Flat Layout)
   ======================================================== */
.cards-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.q-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  position: relative;
  transition: border-color 0.15s;
}
.q-card:hover {
  border-color: var(--border-strong);
}
.q-card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.q-title-wrap {
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.q-title {
  margin: 0;
  font-size: 1.05rem;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.q-mark {
  font-size: 0.78rem;
  font-weight: 600;
  background: var(--mark-bg);
  color: var(--mark-color);
  padding: 2px 7px;
  border-radius: var(--radius);
}
.q-actions {
  display: flex;
  gap: 6px;
}
.btn-q-action {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: var(--radius);
  padding: 4px 8px;
  font-size: 0.76rem;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-q-action:hover {
  color: var(--ink);
  border-color: var(--border-strong);
}
.btn-q-action.active-star {
  color: #d97706;
  border-color: #d97706;
  background: rgba(217, 119, 6, 0.08);
}
.btn-q-action.active-check {
  color: #16a34a;
  border-color: #16a34a;
  background: rgba(22, 163, 74, 0.08);
}

.q-citation {
  font-size: 0.8rem;
  color: var(--muted);
  margin-bottom: 10px;
}
.q-summary {
  font-size: 0.9rem;
  margin: 0 0 12px;
  color: var(--ink);
}
.q-note {
  font-size: 0.82rem;
  padding: 8px 12px;
  background: var(--surface-hover);
  border-left: 2px solid var(--border-strong);
  margin-bottom: 12px;
  color: var(--ink-secondary);
}

.q-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 14px;
}
.q-tag {
  font-size: 0.76rem;
  padding: 2px 8px;
  background: var(--tag-bg);
  color: var(--tag-ink);
  border-radius: var(--radius);
  text-decoration: none;
}
.q-tag:hover {
  color: var(--ink);
}

.img-container {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #ffffff;
  overflow: hidden;
  margin-bottom: 12px;
  text-align: center;
}
.img-container img {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 0 auto;
  cursor: zoom-in;
}

/* Minimal Details Accordion */
.details-clean {
  border-top: 1px solid var(--border);
  padding-top: 8px;
  margin-top: 8px;
}
.details-clean summary {
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--ink-secondary);
  cursor: pointer;
  padding: 4px 0;
  user-select: none;
}
.details-clean summary:hover {
  color: var(--ink);
}
.details-body {
  margin-top: 8px;
}

.q-footer {
  margin-top: 10px;
  display: flex;
  justify-content: flex-end;
}
.btn-compare-link {
  background: transparent;
  border: 0;
  color: var(--muted);
  font-size: 0.78rem;
  cursor: pointer;
  text-decoration: underline;
  padding: 0;
}
.btn-compare-link:hover {
  color: var(--ink);
}

/* ========================================================
   Cheatsheet Active-Recall Flashcard System
   ======================================================== */
.flashcard-wrap {
  max-width: 760px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.flashcard-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.flashcard-filters {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.flashcard-stats {
  font-size: 0.82rem;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 10px;
}
.flashcard-stats b {
  color: var(--ink);
}
.flashcard-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 28px 24px;
  min-height: 280px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: border-color 0.15s;
}
.flashcard-box:hover {
  border-color: var(--border-strong);
}
.flashcard-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  font-size: 0.8rem;
  color: var(--muted);
}
.flashcard-topic-tag {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 500;
}
.flashcard-indicator {
  width: 8px;
  height: 8px;
  border-radius: 2px;
  background: var(--c, #666);
}
.flashcard-question-text {
  font-size: 1.2rem;
  font-weight: 600;
  line-height: 1.45;
  color: var(--ink);
  letter-spacing: -0.01em;
  margin: 0 0 20px;
}
.flashcard-reveal-btn {
  background: var(--surface-hover);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
  color: var(--ink-secondary);
  font-family: inherit;
  font-size: 0.88rem;
  font-weight: 500;
  padding: 14px;
  width: 100%;
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
}
.flashcard-reveal-btn:hover {
  background: var(--border);
  color: var(--ink);
}
.flashcard-answer-box {
  background: var(--surface-hover);
  border-radius: var(--radius);
  border-left: 3px solid var(--ink);
  padding: 16px 18px;
  margin-top: 14px;
  animation: fadeInAns 0.15s ease-out;
}
@keyframes fadeInAns {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
.flashcard-answer-text {
  font-size: 0.92rem;
  line-height: 1.6;
  color: var(--ink);
}
.flashcard-eval-bar {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.btn-eval-review {
  background: transparent;
  border: 1px solid #f87171;
  color: #dc2626;
  border-radius: var(--radius);
  padding: 6px 14px;
  font-family: inherit;
  font-size: 0.82rem;
  font-weight: 500;
  cursor: pointer;
}
.btn-eval-review:hover {
  background: rgba(239, 68, 68, 0.08);
}
.btn-eval-mastered {
  background: var(--ink);
  border: 1px solid var(--ink);
  color: var(--surface);
  border-radius: var(--radius);
  padding: 6px 14px;
  font-family: inherit;
  font-size: 0.82rem;
  font-weight: 500;
  cursor: pointer;
}
.btn-eval-mastered:hover {
  opacity: 0.9;
}
.flashcard-footer-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 14px;
}
.flashcard-shortcuts-tip {
  font-size: 0.75rem;
  color: var(--muted);
  text-align: center;
  margin-top: 6px;
}

/* ========================================================
   Lightbox Modal (Minimalist)
   ======================================================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0, 0, 0, 0.65);
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s ease;
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.modal-top {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.modal-top-title {
  font-size: 0.9rem;
  font-weight: 600;
}
.modal-top-tabs {
  display: flex;
  gap: 4px;
}
.btn-modal-tab {
  background: transparent;
  border: 0;
  padding: 4px 10px;
  font-size: 0.8rem;
  font-family: inherit;
  color: var(--muted);
  border-radius: var(--radius);
  cursor: pointer;
}
.btn-modal-tab.active {
  background: var(--surface-hover);
  color: var(--ink);
  font-weight: 600;
}
.btn-modal-close {
  background: transparent;
  border: 0;
  font-size: 1.1rem;
  color: var(--muted);
  cursor: pointer;
  padding: 4px 8px;
}
.btn-modal-close:hover {
  color: var(--ink);
}
.modal-content-area {
  flex: 1;
  overflow: auto;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-content-area img {
  max-width: 100%;
  max-height: 85vh;
  object-fit: contain;
  background: #ffffff;
  border-radius: var(--radius);
}
.split-view {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  width: 100%;
  max-width: 1400px;
  height: 85vh;
}
.split-pane {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.split-pane-head {
  padding: 8px 14px;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
}
.split-pane-body {
  flex: 1;
  overflow: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--ink);
  color: var(--surface);
  padding: 8px 16px;
  border-radius: var(--radius);
  font-size: 0.82rem;
  font-weight: 500;
  opacity: 0;
  transform: translateY(8px);
  transition: all 0.2s ease;
  pointer-events: none;
  z-index: 120;
}
.toast.show {
  opacity: 1;
  transform: translateY(0);
}

/* ========================================================
   Cheatsheets Minimalist View
   ======================================================== */
.cheatsheets-wrap {
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.sheet-topic-bar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.sheet-pill {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--ink-secondary);
  border-radius: var(--radius);
  padding: 5px 10px;
  font-size: 0.8rem;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
}

}

</style>
</head>
<body>

<!-- Minimalist Password Gate Screen -->
<div id="lock-screen" class="lock-screen">
  <div class="lock-card">
    <h1 class="lock-title">SENOTS</h1>
    <p class="lock-desc">Enter passcode to access past paper revision questions.</p>

    <form id="lock-form" class="lock-form" onsubmit="return false;">
      <div class="lock-input-wrap">
        <input type="password" id="lock-password" class="lock-input" placeholder="Passcode" autocomplete="current-password" autofocus required>
        <button type="button" id="lock-toggle-pwd" class="lock-eye-btn" title="Show/hide">Show</button>
      </div>
      <div class="lock-options">
        <label>
          <input type="checkbox" id="lock-remember" checked>
          <span>Remember on this device</span>

<!-- Main Minimalist Portal -->
<div id="app-root">
  <header class="site-header">
    <div class="header-inner">

        <button class="tab-link" data-view="cards" role="tab" aria-selected="false">Questions</button>
        <button class="tab-link" data-view="practice" role="tab" aria-selected="false">Practice</button>
        <button class="tab-link" data-view="cheatsheets" role="tab" aria-selected="false">Cheatsheets</button>
      </nav>

      <div class="header-right">
        <span class="stats-badge" id="stats-pill" title="Filter by mastered questions">
          Mastered: <b id="mastery-count-txt">0</b> / <span id="mastery-total-txt">1,830</span>m
        </span>
        <button class="btn-minimal" id="theme-toggle" title="Toggle theme">Theme</button>

  </header>

  <main class="container">
    <!-- Filter Panel -->
    <section class="filter-panel">
      <div class="search-input-wrap">
        <input type="search" id="q" class="search-input" placeholder="Search keywords, questions, fossils, formulas... (Press '/' to focus)" aria-label="Search questions">

      <div class="filter-row">
        <select id="level" class="select-minimal"></select>
        <select id="topic" class="select-minimal"></select>
        <select id="year" class="select-minimal"></select>
        <select id="skill" class="select-minimal"></select>

        <button type="button" class="chip-btn" data-chip="as">AS Level</button>
        <button type="button" class="chip-btn" data-chip="a2">A Level</button>
        <button type="button" class="chip-btn" data-chip="high">≥4 Marks</button>

    <!-- Results Status Bar -->

<!-- Lightbox Modal -->
<div class="modal-overlay" id="modal-box" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal-top">
    <div class="modal-top-title" id="modal-title-txt">Question</div>
    <div class="modal-top-tabs" id="modal-tabs-wrap">
      <button class="btn-modal-tab active" data-tab="question">Question</button>
      <button class="btn-modal-tab" data-tab="figures" id="modal-tab-figures">Figures</button>
      <button class="btn-modal-tab" data-tab="markscheme" id="modal-tab-ms">Mark Scheme</button>
      <button class="btn-modal-tab" data-tab="split" id="modal-tab-split">Side-by-Side</button>

  </div>
  <div class="modal-content-area" id="modal-body"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ========================================================
   SENOTS Minimalist Engine
   ======================================================== */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ========================================================
   Password Gate (Passcode: "geology")
   ======================================================== */
const PASS_HASH = '1cfe1c910983119342c466a3954eac2b38c70c784d670045d882a39abf7aabc9';

async function sha256(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function isAuthorized() {
  return localStorage.getItem('senots_auth') === 'valid' || sessionStorage.getItem('senots_auth') === 'valid';
}

function setAuthorized(remember) {
  if (remember) {
    localStorage.setItem('senots_auth', 'valid');
  } else {
    sessionStorage.setItem('senots_auth', 'valid');
  }
}

function lockSite() {
  localStorage.removeItem('senots_auth');
  sessionStorage.removeItem('senots_auth');
  location.reload();
}

async function handleUnlockSubmit() {
  const input = $('#lock-password');
  const err = $('#lock-error-msg');
  const remember = $('#lock-remember').checked;
  const pwd = input.value.trim();

  if (!pwd) {
    err.textContent = 'Please enter passcode.';
    return;
  }

  const hash = await sha256(pwd);
  if (hash === PASS_HASH) {
    err.textContent = '';
    setAuthorized(remember);
    unlockPortal();
  } else {
    err.textContent = 'Incorrect passcode.';
    input.select();
  }
}

function unlockPortal() {
  $('#lock-screen').style.display = 'none';
  $('#app-root').classList.add('unlocked');
  loadQuestionBank();
}

$('#lock-form').onsubmit = handleUnlockSubmit;
$('#lock-submit-btn').onclick = handleUnlockSubmit;
$('#lock-toggle-pwd').onclick = () => {
  const input = $('#lock-password');
  const isPwd = input.type === 'password';
  input.type = isPwd ? 'text' : 'password';
  $('#lock-toggle-pwd').textContent = isPwd ? 'Hide' : 'Show';
};
$('#btn-lock-site').onclick = () => {
  if (confirm('Lock portal?')) lockSite();
};

/* ========================================================
   Theme Minimalist
   ======================================================== */
const preferredTheme = localStorage.getItem('senots_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
document.documentElement.setAttribute('data-theme', preferredTheme);

$('#theme-toggle').onclick = () => {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('senots_theme', next);
};

/* ========================================================
   State & Topic Natural Color Mapping
   ======================================================== */
const BASE = {
  '1.1':'#786458', '2.1':'#a38a53', '2.2':'#9e554d', '2.3':'#506e5e',
  '3.1':'#7a8751', '3.2':'#476579', '4.1':'#4a5463', '4.2':'#5c4a6b',
  'G1':'#3a6366', 'G2':'#736336', 'G3':'#526b3e', 'G4':'#7d5334',
  'T1':'#8c4040', 'T2':'#435c75', 'T3':'#574763', 'T4':'#6e5244', 'T5':'#324b59'
};
const colorOf = id => BASE[id] || BASE[String(id).split('.')[0]] || '#666';

let D, T = {}, S = {}, CHEATS = null, FLASHCARDS = [];
let sheetMastered = new Set(JSON.parse(localStorage.getItem('senots_sheet_mastered') || '[]'));
let sheetStarred = new Set(JSON.parse(localStorage.getItem('senots_sheet_starred') || '[]'));
let practiceState = { topic: '', status: '', idx: 0, revealed: false };
let activeSheetTopic = '1.1';

let state = {
  view: 'strata',
  level: '',
  topic: '',
  skill: '',
  year: '',
  min: 0,
  status: '',
  q: '',
  pick: '',
  practiceIdx: 0,
  timerRunning: false,
  timerSeconds: 0,
  timerInterval: null
};

let mastered = new Set(JSON.parse(localStorage.getItem('senots_mastered') || '[]'));
let bookmarked = new Set(JSON.parse(localStorage.getItem('senots_bookmarked') || '[]'));

function saveMastered() {
  localStorage.setItem('senots_mastered', JSON.stringify([...mastered]));
  updateMasteryStats();
}
function saveBookmarked() {
  localStorage.setItem('senots_bookmarked', JSON.stringify([...bookmarked]));
}

function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

if (isAuthorized()) {
  unlockPortal();
} else {
  $('#lock-screen').style.display = 'flex';
  $('#lock-password').focus();
}

function loadQuestionBank() {
  if (D) return;
  fetch('cheatsheets.json').then(r => r.json()).then(c => { CHEATS = c; buildFlashcards(); }).catch(() => {});
  fetch('flashcards.json').then(r => r.json()).then(fc => { FLASHCARDS = fc; }).catch(() => {});
  fetch('questions.json')
    .then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(d => {
      D = d;
      d.papers.forEach(p => { p.level = p.level || 'AS'; });
      D.P = Object.fromEntries(d.papers.map(p => [p.id, p]));
      d.topics.forEach(t => T[t.id] = t);
      d.skills.forEach(s => S[s.id] = s);
      d.questions.forEach((x, i) => x.i = i);
      initApp();
    })
    .catch(() => {
      $('#app-view').innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px 0">Could not load questions.json</p>';
    });
}

function initApp() {
  opts('#level', 'All Levels', (D.levels || []).map(l => [l.id, l.name]));
  $('#topic').innerHTML = buildTopicOptions();
  opts('#skill', 'All Skills', D.skills.map(s => [s.id, s.name]));
  const years = [...new Set(D.papers.map(p => p.year))].sort((a, b) => b - a);
  opts('#year', 'All Years', years.map(y => [y, y]));
  opts('#min', 'Any Marks', [[2, '2+ Marks'], [3, '3+ Marks'], [4, '4+ Marks'], [6, '6+ Marks']]);

  $('.filter-panel').addEventListener('input', onFilterChange);
  $('#btn-reset').onclick = resetFilters;
  $('#btn-random').onclick = pickRandomQuestion;
  $('#brand-link').onclick = e => { e.preventDefault(); state.view = 'strata'; resetFilters(); };

  $$('.tab-link').forEach(btn => {
    btn.onclick = () => {
      state.view = btn.dataset.view;
      state.pick = '';
      syncViewButtons();
      toHash();
      render();
    };
  });

  $$('.chip-btn[data-chip]').forEach(chip => {
    chip.onclick = () => {
      const c = chip.dataset.chip;
      if (c === 'all') { state.level = ''; state.min = 0; state.skill = ''; state.status = ''; }
      else if (c === 'as') { state.level = 'AS'; }
      else if (c === 'a2') { state.level = 'A'; }
      else if (c === 'high') { state.min = 4; }
      else if (c === 'maths') { state.skill = 'maths'; }
      else if (c === 'review') { state.status = 'bookmarked'; }
      if (state.view === 'strata' && c !== 'all' && c !== 'as' && c !== 'a2') state.view = 'cards';
      syncControls();
      toHash();
      render();
    };
  });

  $('#stats-pill').onclick = () => {
    state.status = state.status === 'mastered' ? '' : 'mastered';
    if (state.view === 'strata') state.view = 'cards';
    syncControls();
    toHash();
    render();
  };

  window.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') {
      e.preventDefault();
      $('#q').focus();
    }
  });

  window.addEventListener('hashchange', () => { fromHash(); syncControls(); syncViewButtons(); render(); });

  fromHash();
  syncControls();
  syncViewButtons();
  updateMasteryStats();
  render();
}

function opts(sel, first, items) {
  $(sel).innerHTML = '<option value="">' + first + '</option>' + items.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('');
}

function buildTopicOptions() {
  const gs = {};
  D.topics.forEach(t => { const g = t.group || 'Topics'; (gs[g] = gs[g] || []).push(t); });
  return '<option value="">All Topics</option>' + Object.entries(gs).map(([g, ts]) =>
    `<optgroup label="${esc(g)}">` + ts.map(t => `<option value="${esc(t.id)}">${esc(t.id)} ${esc(t.name)}</option>`).join('') + '</optgroup>').join('');
}

function onFilterChange() {
  state.q = $('#q').value.trim();
  state.level = $('#level').value;
  state.topic = $('#topic').value;
  state.year = $('#year').value;
  state.skill = $('#skill').value;
  state.min = +$('#min').value || 0;
  state.status = $('#status').value;
  state.pick = '';
  if ((state.topic || state.skill || state.year || state.min || state.q || state.status) && state.view === 'strata') {
    state.view = 'cards';
  }
  syncViewButtons();
  toHash();
  render();
}

function resetFilters() {
  state = { ...state, level:'', topic:'', skill:'', year:'', min:0, status:'', q:'', pick:'' };
  syncControls();
  toHash();
  render();
}

function syncControls() {
  $('#q').value = state.q;
  $('#level').value = state.level;
  $('#topic').value = state.topic;
  $('#year').value = state.year;
  $('#skill').value = state.skill;
  $('#min').value = state.min || '';
  $('#status').value = state.status || '';

  $$('.chip-btn[data-chip]').forEach(c => {
    const val = c.dataset.chip;
    let act = false;
    if (val === 'as' && state.level === 'AS') act = true;
    if (val === 'a2' && state.level === 'A') act = true;
    if (val === 'high' && state.min >= 4) act = true;
    if (val === 'maths' && state.skill === 'maths') act = true;
    if (val === 'review' && state.status === 'bookmarked') act = true;
    c.classList.toggle('active', act);
  });
}

function syncViewButtons() {
  $$('.tab-link').forEach(b => {
    const isAct = b.dataset.view === state.view;
    b.classList.toggle('active', isAct);
    b.setAttribute('aria-selected', isAct);
  });
}

function fromHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  state.view = p.get('view') || state.view || 'strata';
  state.level = p.get('level') || '';
  state.topic = p.get('topic') || '';
  state.skill = p.get('skill') || '';
  state.year = p.get('year') || '';
  state.min = +p.get('min') || 0;
  state.status = p.get('status') || '';
  state.q = p.get('q') || '';
  state.pick = p.get('pick') || '';
}

function toHash() {
  const p = new URLSearchParams();
  if (state.view && state.view !== 'strata') p.set('view', state.view);
  ['level','topic','skill','year','min','status','q','pick'].forEach(k => {
    if (state[k]) p.set(k, state[k]);
  });
  history.replaceState(null, '', location.pathname + location.search + (p.toString() ? '#' + p : ''));
}

function filtered() {
  const query = state.q.toLowerCase();
  return D.questions.filter(x => {
    if (state.pick && x.id !== state.pick) return false;
    if (state.level && D.P[x.paper].level !== state.level) return false;
    if (state.topic && !x.topics.includes(state.topic)) return false;
    if (state.skill && !x.skills.includes(state.skill)) return false;
    if (state.year && D.P[x.paper].year != state.year) return false;
    if (x.marks < state.min) return false;
    if (state.status === 'mastered' && !mastered.has(x.id)) return false;
    if (state.status === 'unmastered' && mastered.has(x.id)) return false;
    if (state.status === 'bookmarked' && !bookmarked.has(x.id)) return false;
    if (query) {
      const blob = (x.summary + ' ' + x.question + ' ' + x.topics.map(t => T[t] ? T[t].name : '').join(' ') + ' ' + x.skills.map(s => S[s] ? S[s].name : '').join(' ')).toLowerCase();
      if (!blob.includes(query)) return false;
    }
    return true;
  }).sort((a, b) => D.P[b.paper].year - D.P[a.paper].year || a.i - b.i);
}

function updateMasteryStats() {
  if (!D) return;
  let masteredMarks = 0;
  let totalMarks = 0;
  D.questions.forEach(q => {
    totalMarks += q.marks;
    if (mastered.has(q.id)) masteredMarks += q.marks;
  });
  $('#mastery-count-txt').textContent = masteredMarks.toLocaleString();
  $('#mastery-total-txt').textContent = totalMarks.toLocaleString();
}

function pickRandomQuestion() {
  const pool = filtered();
  if (!pool.length) return;
  const q = pool[Math.floor(Math.random() * pool.length)];
  state.pick = q.id;
  state.view = 'cards';
  syncViewButtons();
  toHash();
  render();
  showToast(`Question ${q.question} (${q.marks}m)`);
}

function render() {
  const list = filtered();
  const totalM = list.reduce((n, x) => n + x.marks, 0);

  if (state.pick) {
    $('#results-count-msg').innerHTML = `1 question (${totalM} marks) · <a href="javascript:void(0)" onclick="state.pick='';toHash();render();" style="color:inherit;text-decoration:underline">Show all</a>`;
  } else {
    $('#results-count-msg').innerHTML = `${list.length.toLocaleString()} questions (${totalM.toLocaleString()} marks)`;
  }

  const badges = [];
  if (state.level) badges.push(state.level);
  if (state.topic) badges.push(state.topic);
  if (state.year) badges.push(state.year);
  if (state.skill) badges.push(S[state.skill] ? S[state.skill].name : state.skill);
  if (state.status) badges.push(state.status);
  if (state.min) badges.push(`≥${state.min}m`);
  $('#results-active-tag').textContent = badges.join(' · ');

  const filterPanel = $('.filter-panel');
  const statusBar = $('#status-bar');
  if (state.view === 'cheatsheets') {
    if (filterPanel) filterPanel.style.display = 'none';
    if (statusBar) statusBar.style.display = 'none';
    renderCheatsheets();
  } else if (state.view === 'practice') {
    if (filterPanel) filterPanel.style.display = 'none';
    if (statusBar) statusBar.style.display = 'none';
    renderFlashcardPractice();
  } else {
    if (filterPanel) filterPanel.style.display = '';
    if (statusBar) statusBar.style.display = '';
    if (state.view === 'strata') {
      renderStrata();
    } else {
      renderCards(list);
    }
  }
}

/* ========================================================
   VIEW 1: STRATIGRAPHY COLUMN (MINIMALIST)
   ======================================================== */
function renderStrata() {
  const inLevel = x => !state.level || D.P[x.paper].level === state.level;
  const groups = {};
  D.topics.forEach(t => { const g = t.group || 'Topics'; (groups[g] = groups[g] || []).push(t); });

  let html = `<div class="strata-wrap">`;

  for (const [g, ts] of Object.entries(groups)) {
    const rows = ts.map(t => {
      const qs = D.questions.filter(x => x.topics.includes(t.id) && inLevel(x));
      if (!qs.length) return '';
      const marks = qs.reduce((n, x) => n + x.marks, 0);
      const masteredInTopic = qs.filter(x => mastered.has(x.id)).reduce((n, x) => n + x.marks, 0);
      const c = colorOf(t.id);

      return `<a class="strata-row" href="#view=cards&topic=${esc(t.id)}${state.level ? '&level=' + esc(state.level) : ''}">
        <div class="strata-left">
          <span class="strata-color-indicator" style="--c:${c}"></span>
          <span class="strata-name">${esc(t.id)} · ${esc(t.name)}</span>
        </div>
        <div class="strata-right">
          <span>${masteredInTopic ? `${masteredInTopic}/${marks}m mastered` : `${qs.length} questions`}</span>
          <span class="strata-mark-pill">${marks}m</span>
        </div>
      </a>`;
    }).join('');

    if (rows) {
      html += `
        <section>
          <div class="strata-section-title">${esc(g)}</div>
          <div class="strata-column">${rows}</div>
        </section>
      `;
    }
  }

  html += `</div>`;
  $('#app-view').innerHTML = html;
}

/* ========================================================
   VIEW 2: QUESTION CARDS (MINIMALIST)
   ======================================================== */
function renderCards(list) {
  if (!list.length) {
    $('#app-view').innerHTML = `
      <div style="text-align:center;padding:48px 0;color:var(--muted)">
        <p>No questions match current filters.</p>
        <button type="button" class="btn-minimal" onclick="resetFilters()">Clear Filters</button>
      </div>`;
    return;
  }

  const html = `<div class="cards-list">` + list.map(q => renderCard(q)).join('') + `</div>`;
  $('#app-view').innerHTML = html;
}

function renderCard(x) {
  const p = D.P[x.paper];
  const isMastered = mastered.has(x.id);
  const isBookmarked = bookmarked.has(x.id);

  const tags = x.topics.map(t => `<a class="q-tag" href="#view=cards&topic=${t}">${esc(t)} ${esc(T[t] ? T[t].name : '')}</a>`).join('')
    + x.skills.map(s => `<span class="q-tag">${esc(S[s] ? S[s].name : s)}</span>`).join('');

  return `
    <article class="q-card" id="q-${x.id}">
      <div class="q-card-header">
        <div class="q-title-wrap">
          <h2 class="q-title">Question ${esc(x.question)}</h2>
          <span class="q-mark">${x.marks} ${x.marks === 1 ? 'mark' : 'marks'}</span>
        </div>
        <div class="q-actions">
          <button type="button" class="btn-q-action ${isBookmarked ? 'active-star' : ''}" onclick="toggleBookmark('${x.id}', this)">
            ${isBookmarked ? 'Bookmarked' : 'Bookmark'}
          </button>
          <button type="button" class="btn-q-action ${isMastered ? 'active-check' : ''}" onclick="toggleMastered('${x.id}', this)">
            ${isMastered ? 'Mastered' : 'Mark done'}
          </button>
          <button type="button" class="btn-q-action" onclick="copyQuestionLink('${x.id}')" title="Copy link">Link</button>
        </div>
      </div>

      <div class="q-citation">${esc(p.series)} ${p.year} · ${esc(p.unit)} (${esc(p.code)}) · Page ${x.page}</div>

      <p class="q-summary">${esc(x.summary)}</p>
      ${x.note ? `<div class="q-note">${esc(x.note)}</div>` : ''}

      <div class="q-tags">${tags}</div>

      <div class="img-container">
        <img loading="lazy" src="${esc(x.image)}" alt="Question ${esc(x.question)}" onclick="openModal('${x.id}', 'question')">
      </div>

      ${(x.figures || []).map((f, fi) => `
        <details class="details-clean">
          <summary>${figLabel(f)}</summary>
          <div class="details-body">
            <div class="img-container">
              <img loading="lazy" src="${esc(f)}" alt="${figLabel(f)}" onclick="openModal('${x.id}', 'figure', ${fi})">
            </div>
          </div>
        </details>
      `).join('')}

      ${x.markscheme ? `
        <details class="details-clean">
          <summary>Mark scheme</summary>
          <div class="details-body">
            <div class="img-container">
              <img loading="lazy" src="${esc(x.markscheme)}" alt="Mark Scheme" onclick="openModal('${x.id}', 'markscheme')">
            </div>
          </div>
        </details>
      ` : ''}

      <div class="q-footer" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <a href="javascript:void(0)" class="btn-compare-link" onclick="openSheet('${x.topics[0]}')">Cheatsheet: ${esc(x.topics[0])} ${esc(T[x.topics[0]] ? T[x.topics[0]].name : '')}</a>
        <button type="button" class="btn-compare-link" onclick="openModal('${x.id}', 'split')">View side-by-side with mark scheme</button>
      </div>
    </article>
  `;
}

function figLabel(f) {
  if (f.includes('datasheet')) return 'Mineral Data Sheet';
  if (f.includes('map1')) return 'Map 1';
  if (f.includes('specimens')) return 'Specimen photographs';
  if (f.includes('photos23')) return 'Photographs 2 and 3';
  if (f.includes('photo4')) return 'Photograph 4';
  if (f.includes('photo1')) return 'Photograph 1';
  if (f.includes('photo2')) return 'Photograph 2';
  if (f.includes('photo3')) return 'Photograph 3';
  if (f.includes('photos')) return 'Photographs 1 and 2';
  return 'Resource figure';
}

function toggleMastered(id, btn) {
  if (mastered.has(id)) {
    mastered.delete(id);
    if (btn) {
      btn.classList.remove('active-check');
      btn.textContent = 'Mark done';
    }
  } else {
    mastered.add(id);
    if (btn) {
      btn.classList.add('active-check');
      btn.textContent = 'Mastered';
    }
  }
  saveMastered();
}

function toggleBookmark(id, btn) {
  if (bookmarked.has(id)) {
    bookmarked.delete(id);
    if (btn) {
      btn.classList.remove('active-star');
      btn.textContent = 'Bookmark';
    }
  } else {
    bookmarked.add(id);
    if (btn) {
      btn.classList.add('active-star');
      btn.textContent = 'Bookmarked';
    }
  }
  saveBookmarked();
}

function copyQuestionLink(id) {
  const url = `${location.origin}${location.pathname}#view=cards&pick=${id}`;
  navigator.clipboard.writeText(url).then(() => {
    showToast('Link copied');
  }).catch(() => {
    prompt('URL:', url);
  });
}

/* ========================================================
   VIEW 3: CHEATSHEET FLASHCARD PRACTICE
   ======================================================== */
function buildFlashcards() {
  if (FLASHCARDS && FLASHCARDS.length) return;
  if (!CHEATS) return;
  const cards = [];
  let cid = 1;
  for (const [tid, tdata] of Object.entries(CHEATS)) {
    for (const sec of (tdata.sections || [])) {
      for (const pt of sec.points) {
        const m = pt.match(/<b>(.*?)<\/b>[:\s-]*(.*)/s);
        let qText = '', aText = '';
        if (m) {
          let k = m[1].replace(/:$/, '').trim();
          let ans = m[2].trim();
          if (k.toLowerCase().includes('vs')) qText = `Compare and distinguish: ${k}`;
          else if (k.toLowerCase().includes('definition')) qText = `Define: ${k.replace(/ definition/i, '')}`;
          else if (k.toLowerCase().startsWith('evidence')) qText = `What is the ${k}?`;
          else if (/criteria|rules|properties/i.test(k)) qText = `State the key ${k}:`;
          else if (/ratio|calculation|formula|rule/i.test(k)) qText = `State the principle/formula for: ${k}`;
          else if (k.endsWith('?')) qText = k;
          else qText = `Explain the key features of: ${k}`;
          aText = ans;
        } else {
          qText = `${sec.heading}: key facts`;
          aText = pt;
        }
        cards.append ? null : cards.push({
          id: `card-${String(cid++).padStart(3, '0')}`,
          topicId: tid,
          topicTitle: tdata.title,
          category: sec.heading,
          question: qText,
          answer: aText
        });
      }
    }
  }
  FLASHCARDS = cards;
}

function startPracticeForTopic(tid) {
  state.view = 'practice';
  practiceState.topic = tid;
  practiceState.idx = 0;
  practiceState.revealed = false;
  syncViewButtons();
  toHash();
  render();
}

function getPracticeCards() {
  if (!FLASHCARDS || !FLASHCARDS.length) {
    buildFlashcards();
  }
  return (FLASHCARDS || []).filter(c => {
    if (practiceState.topic && c.topicId !== practiceState.topic) return false;
    if (practiceState.status === 'unmastered' && sheetMastered.has(c.id)) return false;
    if (practiceState.status === 'mastered' && !sheetMastered.has(c.id)) return false;
    if (practiceState.status === 'starred' && !sheetStarred.has(c.id)) return false;
    return true;
  });
}

function renderFlashcardPractice() {
  const cards = getPracticeCards();
  const totalInBank = FLASHCARDS ? FLASHCARDS.length : 307;
  const totalMasteredCount = sheetMastered.size;

  if (!cards.length) {
    $('#app-view').innerHTML = `
      <div class="flashcard-wrap">
        <div class="flashcard-toolbar">
          <div class="flashcard-filters">
            <select class="select-minimal" onchange="practiceState.topic=this.value;practiceState.idx=0;practiceState.revealed=false;renderFlashcardPractice();">
              ${buildPracticeTopicOpts()}
            </select>
            <select class="select-minimal" onchange="practiceState.status=this.value;practiceState.idx=0;practiceState.revealed=false;renderFlashcardPractice();">
              <option value="" ${practiceState.status===''?'selected':''}>All Cards</option>
              <option value="unmastered" ${practiceState.status==='unmastered'?'selected':''}>Needs Work</option>
              <option value="starred" ${practiceState.status==='starred'?'selected':''}>Starred</option>
              <option value="mastered" ${practiceState.status==='mastered'?'selected':''}>Mastered</option>
            </select>
          </div>
          <div class="flashcard-stats">Mastered: <b>${totalMasteredCount}</b> / ${totalInBank} cards</div>
        </div>
        <div style="text-align:center;padding:48px 0;color:var(--muted)">
          <p>No cards match the selected filter.</p>
          <button type="button" class="btn-minimal" onclick="practiceState.topic='';practiceState.status='';practiceState.idx=0;renderFlashcardPractice();">Reset Filter</button>
        </div>
      </div>
    `;
    return;
  }

  if (practiceState.idx >= cards.length) practiceState.idx = 0;
  if (practiceState.idx < 0) practiceState.idx = cards.length - 1;

  const card = cards[practiceState.idx];
  const isMastered = sheetMastered.has(card.id);
  const isStarred = sheetStarred.has(card.id);
  const cColor = colorOf(card.topicId);

  $('#app-view').innerHTML = `
    <div class="flashcard-wrap">
      <div class="flashcard-toolbar">
        <div class="flashcard-filters">
          <select class="select-minimal" id="practice-topic-sel">
            ${buildPracticeTopicOpts()}
          </select>
          <select class="select-minimal" id="practice-status-sel">
            <option value="" ${practiceState.status===''?'selected':''}>All Cards</option>
            <option value="unmastered" ${practiceState.status==='unmastered'?'selected':''}>Needs Work</option>
            <option value="starred" ${practiceState.status==='starred'?'selected':''}>Starred</option>
            <option value="mastered" ${practiceState.status==='mastered'?'selected':''}>Mastered</option>
          </select>
          <button type="button" class="btn-minimal" id="btn-shuffle-cards" title="Shuffle deck">Shuffle</button>
        </div>
        <div class="flashcard-stats">
          <span>Card <b>${practiceState.idx + 1}</b> of ${cards.length}</span> · 
          <span>Mastered: <b>${totalMasteredCount}</b> / ${totalInBank}</span>
        </div>
      </div>

      <div class="flashcard-box">
        <div>
          <div class="flashcard-top">
            <div class="flashcard-topic-tag">
              <span class="flashcard-indicator" style="--c:${cColor}"></span>
              <span>Topic ${esc(card.topicId)} · ${esc(card.category)}</span>
            </div>
            <button type="button" class="btn-minimal ${isStarred ? 'active-star' : ''}" id="btn-star-card" style="${isStarred?'color:#d97706;border-color:#d97706':''}">
              ${isStarred ? '★ Starred' : '☆ Star'}
            </button>
          </div>

          <h2 class="flashcard-question-text">${esc(card.question)}</h2>

          ${!practiceState.revealed ? `
            <button type="button" class="flashcard-reveal-btn" id="btn-reveal-card">
              Reveal Answer (Press Space)
            </button>
          ` : `
            <div class="flashcard-answer-box">
              <div class="flashcard-answer-text">${card.answer}</div>
              <div class="flashcard-eval-bar">
                <button type="button" class="btn-eval-review" id="eval-card-review">
                  Needs Review (1)
                </button>
                <button type="button" class="btn-eval-mastered" id="eval-card-mastered">
                  ${isMastered ? 'Mastered ✓' : 'Mark Mastered (2) ✓'}
                </button>
              </div>
            </div>
          `}
        </div>

        <div>
          <div class="flashcard-footer-nav">
            <button type="button" class="btn-minimal" id="card-prev">← Prev</button>
            <a href="javascript:void(0)" class="btn-compare-link" onclick="openSheet('${card.topicId}')">View full ${card.topicId} cheatsheet</a>
            <button type="button" class="btn-minimal" id="card-next">Next →</button>
          </div>
          <div class="flashcard-shortcuts-tip">Shortcuts: Space to reveal · 1 Needs Review · 2 Mastered · ← / → Navigate</div>
        </div>
      </div>
    </div>
  `;

  $('#practice-topic-sel').onchange = e => {
    practiceState.topic = e.target.value;
    practiceState.idx = 0;
    practiceState.revealed = false;
    renderFlashcardPractice();
  };

  $('#practice-status-sel').onchange = e => {
    practiceState.status = e.target.value;
    practiceState.idx = 0;
    practiceState.revealed = false;
    renderFlashcardPractice();
  };

  $('#btn-shuffle-cards').onclick = () => {
    shuffle(FLASHCARDS);
    practiceState.idx = 0;
    practiceState.revealed = false;
    renderFlashcardPractice();
    showToast('Deck shuffled');
  };

  $('#btn-star-card').onclick = () => {
    if (sheetStarred.has(card.id)) {
      sheetStarred.delete(card.id);
      showToast('Unstarred card');
    } else {
      sheetStarred.add(card.id);
      showToast('Starred card');
    }
    localStorage.setItem('senots_sheet_starred', JSON.stringify([...sheetStarred]));
    renderFlashcardPractice();
  };

  const revealBtn = $('#btn-reveal-card');
  if (revealBtn) {
    revealBtn.onclick = () => {
      practiceState.revealed = true;
      renderFlashcardPractice();
    };
  }

  const evalReview = $('#eval-card-review');
  if (evalReview) {
    evalReview.onclick = () => {
      if (sheetMastered.has(card.id)) {
        sheetMastered.delete(card.id);
        localStorage.setItem('senots_sheet_mastered', JSON.stringify([...sheetMastered]));
      }
      practiceState.idx++;
      practiceState.revealed = false;
      renderFlashcardPractice();
    };
  }

  const evalMastered = $('#eval-card-mastered');
  if (evalMastered) {
    evalMastered.onclick = () => {
      sheetMastered.add(card.id);
      localStorage.setItem('senots_sheet_mastered', JSON.stringify([...sheetMastered]));
      practiceState.idx++;
      practiceState.revealed = false;
      renderFlashcardPractice();
      showToast('Card mastered! ✓');
    };
  }

  $('#card-prev').onclick = () => {
    practiceState.idx--;
    practiceState.revealed = false;
    renderFlashcardPractice();
  };

  $('#card-next').onclick = () => {
    practiceState.idx++;
    practiceState.revealed = false;
    renderFlashcardPractice();
  };
}

function buildPracticeTopicOpts() {
  const tids = CHEATS ? Object.keys(CHEATS) : ['1.1','2.1','2.2','2.3','3.1','3.2','4.1','4.2'];
  let html = `<option value="">All Topics (${FLASHCARDS?FLASHCARDS.length:307} cards)</option>`;
  tids.forEach(t => {
    const title = CHEATS && CHEATS[t] ? CHEATS[t].title.replace(/^Topic |^Theme /, '') : t;
    const isSel = practiceState.topic === t ? 'selected' : '';
    html += `<option value="${t}" ${isSel}>${t} · ${esc(title)}</option>`;
  });
  return html;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

window.addEventListener('keydown', e => {
  if (state.view !== 'practice') return;
  if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT') return;

  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    practiceState.idx--;
    practiceState.revealed = false;
    renderFlashcardPractice();
  } else if (e.key === 'ArrowRight') {
    e.preventDefault();
    practiceState.idx++;
    practiceState.revealed = false;
    renderFlashcardPractice();
  } else if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    practiceState.revealed = !practiceState.revealed;
    renderFlashcardPractice();
  } else if (e.key === '1' && practiceState.revealed) {
    e.preventDefault();
    const btn = $('#eval-card-review');
    if (btn) btn.click();
  } else if (e.key === '2' && practiceState.revealed) {
    e.preventDefault();
    const btn = $('#eval-card-mastered');
    if (btn) btn.click();
  } else if (e.key === 's' || e.key === 'S') {
    const btn = $('#btn-star-card');
    if (btn) btn.click();
  }
});

/* ========================================================
   LIGHTBOX (MINIMALIST)
   ======================================================== */
let activeModalQ = null;
let activeModalTab = 'question';

function openModal(qid, tab = 'question', figureIndex = 0) {
  const q = D.questions.find(x => x.id === qid);
  if (!q) return;

  activeModalQ = q;
  activeModalTab = tab === 'figure' ? 'figures' : tab;

  $('#modal-title-txt').textContent = `Question ${q.question} (${q.marks}m) · ${D.P[q.paper].year}`;

  const hasFigures = q.figures && q.figures.length > 0;
  $('#modal-tab-figures').style.display = hasFigures ? 'inline-block' : 'none';
  $('#modal-tab-ms').style.display = q.markscheme ? 'inline-block' : 'none';
  $('#modal-tab-split').style.display = q.markscheme ? 'inline-block' : 'none';

  syncModalTabs();
  renderModalContent();

  const m = $('#modal-box');
  m.classList.add('open');
  m.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  const m = $('#modal-box');
  m.classList.remove('open');
  m.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}

$('#modal-close').onclick = closeModal;
$('#modal-box').onclick = e => {
  if (e.target === $('#modal-box')) closeModal();
};
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal-box').classList.contains('open')) closeModal();
});

$$('.btn-modal-tab').forEach(b => {
  b.onclick = () => {
    activeModalTab = b.dataset.tab;
    syncModalTabs();
    renderModalContent();
  };
});

function syncModalTabs() {
  $$('.btn-modal-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === activeModalTab);
  });
}

function renderModalContent() {
  if (!activeModalQ) return;
  const q = activeModalQ;
  const body = $('#modal-body');

  if (activeModalTab === 'question') {
    body.innerHTML = `<img src="${esc(q.image)}" alt="Question ${esc(q.question)}">`;
  } else if (activeModalTab === 'figures') {
    body.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:16px;align-items:center">
        ${(q.figures || []).map(f => `<img src="${esc(f)}" alt="${figLabel(f)}">`).join('')}
      </div>`;
  } else if (activeModalTab === 'markscheme') {
    body.innerHTML = `<img src="${esc(q.markscheme)}" alt="Mark Scheme">`;
  } else if (activeModalTab === 'split') {
    body.innerHTML = `
      <div class="split-view">
        <div class="split-pane">
          <div class="split-pane-head">Question & Resource</div>
          <div class="split-pane-body">
            <img src="${esc(q.image)}" alt="Question">
            ${(q.figures || []).map(f => `<img src="${esc(f)}" alt="${figLabel(f)}">`).join('')}
          </div>
        </div>
        <div class="split-pane">
          <div class="split-pane-head">Mark Scheme</div>
          <div class="split-pane-body">
            <img src="${esc(q.markscheme)}" alt="Mark Scheme">
          </div>
        </div>
      </div>`;
  }
}

function openSheet(tid) {
  state.view = 'cheatsheets';
  activeSheetTopic = tid in (CHEATS || {}) ? tid : (tid.split('.')[0] in (CHEATS || {}) ? tid.split('.')[0] : '1.1');
  syncViewButtons();
  toHash();
  render();
}

function renderCheatsheets() {
  if (!CHEATS) {
    $('#app-view').innerHTML = `<p style="text-align:center;padding:40px 0;color:var(--muted)">Loading cheatsheets...</p>`;
    return;
  }

  const topicKeys = Object.keys(CHEATS);
  if (!topicKeys.includes(activeSheetTopic)) activeSheetTopic = topicKeys[0];

  const pillsHtml = topicKeys.map(k => {
    const isAct = k === activeSheetTopic;
    return `<button type="button" class="sheet-pill ${isAct ? 'active' : ''}" onclick="activeSheetTopic='${k}';renderCheatsheets()">${k} · ${esc(CHEATS[k].title.split('·')[1] || k)}</button>`;
  }).join('');

  const current = CHEATS[activeSheetTopic];
  let sectionsHtml = '';
  (current.sections || []).forEach(sec => {
    sectionsHtml += `
      <div class="sheet-section">
        <h3 class="sheet-section-title">${esc(sec.heading)}</h3>
        <ul class="sheet-list">
          ${sec.points.map(pt => `<li>${pt}</li>`).join('')}
        </ul>
      </div>
    `;
  });

  $('#app-view').innerHTML = `
    <div class="cheatsheets-wrap">
      <div class="sheet-topic-bar">${pillsHtml}</div>
      <article class="sheet-card">
        <div class="sheet-head">
          <div>
            <h2 class="sheet-title">${esc(current.title)}</h2>
            <div class="sheet-spec"><b>Specification:</b> ${esc(current.spec)}</div>
          </div>
          <button type="button" class="btn-minimal" onclick="startPracticeForTopic('${activeSheetTopic}')">
            Practice flashcards for this topic →
          </button>
        </div>
        ${sectionsHtml}
      </article>
    </div>
  `;
}
